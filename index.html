<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전남대 지각 레이스</title>
  <link rel="stylesheet" href="assets/css/style.css?v=1">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "./assets/js/map.js": "./assets/js/map.js?v=1",
      "./assets/js/car.js": "./assets/js/car.js?v=1",
      "./assets/js/camera.js": "./assets/js/camera.js?v=1",
      "./assets/js/hud.js": "./assets/js/hud.js?v=1"
    }
  }
  </script>
</head>
<body>
  <div id="loading">캠퍼스 불러오는 중…</div>

  <div id="hud">
    <div id="building-name" class="pill hidden"></div>

    <div id="speedo" class="panel">
      <span id="speed">0</span><small>km/h</small>
    </div>

    <div id="quality" class="panel">
      <span>그래픽</span>
      <button data-q="low">낮음</button>
      <button data-q="high">높음</button>
      <span id="fps" class="hidden"></span>
    </div>

    <div id="toast" class="pill hidden"></div>

    <div id="help" class="panel">
      <div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 운전</div>
      <div><kbd>Space</kbd> 브레이크·드리프트 &nbsp; <kbd>Shift</kbd> 부스트</div>
      <div><kbd>C</kbd> 시점 바꾸기 &nbsp; <kbd>H</kbd> 조작법 다시 보기</div>
    </div>

    <a id="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">지도 데이터 © OpenStreetMap 기여자</a>
  </div>

  <script type="module" src="assets/js/main.js?v=1"></script>
</body>
</html>
