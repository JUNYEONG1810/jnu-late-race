<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전남대 지각 레이스</title>
  <link rel="stylesheet" href="assets/css/style.css?v=8">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "./assets/js/map.js": "./assets/js/map.js?v=8",
      "./assets/js/car.js": "./assets/js/car.js?v=8",
      "./assets/js/camera.js": "./assets/js/camera.js?v=8",
      "./assets/js/hud.js": "./assets/js/hud.js?v=8",
      "./assets/js/voice.js": "./assets/js/voice.js?v=8",
      "./assets/js/late-mode.js": "./assets/js/late-mode.js?v=8",
      "./assets/js/missions-data.js": "./assets/js/missions-data.js?v=8",
      "./assets/js/dialogue-data.js": "./assets/js/dialogue-data.js?v=8",
      "./assets/js/professor.js": "./assets/js/professor.js?v=8",
      "./assets/js/professor-config.js": "./assets/js/professor-config.js?v=8"
    }
  }
  </script>
</head>
<body>
  <div id="loading">캠퍼스 불러오는 중…</div>

  <div id="hud">
    <canvas id="speedlines"></canvas>
    <div id="labels"></div>
    <div id="building-name" class="pill hidden"></div>

    <div id="speedo" class="panel">
      <span id="speed">0</span><small>km/h</small>
    </div>

    <div id="quality" class="panel">
      <span>그래픽</span>
      <button data-q="low">낮음</button>
      <button data-q="high">높음</button>
      <span id="fps" class="hidden"></span>
    </div>

    <div id="toast" class="pill hidden"></div>

    <div id="boost-gauge" class="panel">
      <span class="boost-text">BOOST</span>
      <div class="boost-bar"><div class="boost-fill"></div></div>
    </div>

    <div id="help" class="panel">
      <div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 운전</div>
      <div><kbd>Space</kbd> 브레이크·드리프트 &nbsp; <kbd>Shift</kbd> 부스터 (게이지 사용)</div>
      <div><kbd>C</kbd> 시점 바꾸기 &nbsp; <kbd>H</kbd> 조작법 다시 보기</div>
    </div>

    <button id="late-start" class="panel">🏃 지각 모드 시작 <kbd>L</kbd></button>

    <!-- 지각 모드에서만 보이는 것들 -->
    <div id="late-ui">
      <div id="timer" class="pill">7:00</div>
      <div id="mission-list" class="panel"></div>
      <div id="target-tag" class="pill"></div>
      <div id="target-arrow"><div class="arrow">➤</div><span></span></div>
      <div id="mission-hint" class="pill hidden"></div>
      <div id="mission-progress" class="panel hidden">
        <div class="mp-emoji"></div>
        <div class="mp-line"></div>
        <div class="mp-bar"><div class="mp-fill"></div></div>
      </div>
      <div id="countdown"></div>
    </div>

    <div id="speech" class="hidden">
      <div class="speech-name"></div>
      <div class="speech-text"></div>
      <div class="speech-more">▼</div>
    </div>

    <div id="pause-menu" class="overlay hidden">
      <div class="dialog panel">
        <h2>일시정지</h2>
        <button data-act="resume">계속</button>
        <button data-act="retry">다시하기</button>
        <button data-act="exit">자유 주행으로</button>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="dialog panel">
        <h2 class="res-title"></h2>
        <div class="res-grade"></div>
        <div class="res-times"></div>
        <button data-act="retry">다시하기</button>
        <button data-act="exit">자유 주행으로</button>
      </div>
    </div>

    <a id="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">지도 데이터 © OpenStreetMap 기여자</a>
  </div>

  <script type="module" src="assets/js/main.js?v=8"></script>
</body>
</html>
